[package]
name = "lunar-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny simulated lunar server you connect to from an animated terminal UI, with realistic space-signal delay"
license = "GPL-3.0-only"
repository = "https://github.com/AdriaBC06/Lunar-Link"
readme = "README.md"
keywords = ["tui", "simulator", "space", "latency", "ratatui"]
categories = ["command-line-utilities", "simulation"]
exclude = [".github", "docs/*.gif", "docs/*.png", "docs/*.tape"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
