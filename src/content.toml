options = [
  { label = "Volver al inicio", goto = "inicio" },
  { label = "¿Cuánto tarda la señal?", goto = "senal" },
]

[[node]]
id = "senal"
text = "La luz tarda unos 1,3 segundos en cruzar los 384.000 km que nos separan. Ida y vuelta, unos 2,6. Este mensaje ya ha pagado ese peaje."
