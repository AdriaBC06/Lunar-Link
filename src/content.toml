# Contenido premontado del servidor lunar (Base Tranquilidad).

[[mail]]
from = "Cmdte. Ibarra <ibarra@tranquilidad.luna>"
subject = "Bienvenido a Base Tranquilidad"
body = """
Hola, recién llegado:

Si lees esto, tu enlace funciona y la señal ha viajado 384.000 km para traerte este mensaje. Úsalo con cariño: cada pregunta tarda unos segundos en volver.

Las normas son pocas: no toques el rover de Marta sin permiso, el café del módulo B es sagrado y, si ves una tormenta solar en el panel de telemetría, quédate donde estás.

Un abrazo desde el Mar de la Tranquilidad,
Ibarra
"""

[[mail]]
from = "Marta Okafor <marta@tranquilidad.luna>"
subject = "Re: el rover"
body = """
Alguien ha movido el rover tres metros a la izquierda. Sé que has sido tú.

No pasa nada, pero ahora tiene una rueda atascada en un cráter y el polvo se mete por todas partes. Si pasas por el garaje, tráeme la llave del 13.

PD: la gravedad es un sexto de la terrestre, así que el cráter no es tan profundo como parece. Casi.
"""

[[mail]]
from = "Centro de Control <control@tierra.esa>"
subject = "Ventana de comunicaciones"
body = """
Recordatorio automático.

Durante la fase de cara oculta de la órbita del relé perderás la señal unos 10 segundos cada ciclo. También pueden producirse cortes breves por interferencias y tormentas solares.

No es un fallo: tu cliente reintentará el envío en cuanto vuelva la señal. Paciencia, que la luz solo va a 300.000 km/s.
"""

[[mail]]
from = "Tomás <tomas@tranquilidad.luna>"
subject = "Receta de tortilla lunar"
body = """
Ingredientes (para 4):
  - 6 huevos deshidratados
  - 1 patata del invernadero (la única)
  - Mucha fe

Se bate todo, se cocina a presión reducida y se sirve antes de que flote. Sale rara, pero sale.
"""

[[mail]]
from = "Sistema <no-reply@tranquilidad.luna>"
subject = "Aviso: nivel de polvo"
body = """
El nivel de polvo regolítico ha superado el umbral de confort en el módulo C.

Se recomienda cepillar las botas, sacudir los trajes y no respirar fuerte. El polvo lunar huele a pólvora quemada, no es una metáfora.
"""

