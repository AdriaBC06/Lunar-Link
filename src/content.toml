[[node]]
id = "inicio"
text = "Operador de Base Tranquilidad al habla. Recuerda que hablas con un menú, no con una persona. ¿En qué puedo ayudarte?"
keywords = ["hola", "buenas", "operador", "inicio", "menu"]
options = [
  { label = "¿Dónde estoy?", goto = "donde" },
  { label = "¿Cuánto tarda la señal?", goto = "senal" },
  { label = "Quiero comer algo", goto = "comida" },
  { label = "¿Hay agua?", goto = "agua" },
  { label = "Cuéntame un secreto", goto = "secreto" },
]

[[node]]
id = "donde"
text = "Estás en Base Tranquilidad, en el Mar de la Tranquilidad. Hace 14 días de sol seguidos y 14 de noche. Hoy, de momento, hace un día precioso."
